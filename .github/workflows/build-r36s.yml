name: Build R36S V0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "port/**"
      - ".github/workflows/build-r36s.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake python3 pkg-config git curl bzip2 xz-utils zip \
            libegl-dev libgles-dev libglvnd-dev libdrm-dev libgbm-dev libasound2-dev libudev-dev \
            libwayland-bin ccache

      - name: Cache handheld SDK and Dawn
        uses: actions/cache@v4
        with:
          path: |
            build/melee/build/flip-tools
          key: strikers-r36s-v01-${{ runner.os }}-${{ hashFiles('scripts/build_v01.sh') }}
          restore-keys: |
            strikers-r36s-v01-

      - name: Build PortMaster package
        run: bash scripts/build_v01.sh

      - name: Upload V0.1 package
        uses: actions/upload-artifact@v4
        with:
          name: strikers-r36s-v0.1
          path: dist/strikers-r36s-v0.1.zip
          if-no-files-found: error

      - name: Upload configure/build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strikers-r36s-v0.1-build-tree
          path: |
            build/strikers-r36s/CMakeCache.txt
            build/strikers-r36s/CMakeFiles/CMakeOutput.log
            build/strikers-r36s/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
