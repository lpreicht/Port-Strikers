name: Build R36S V0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "port/**"
      - ".github/workflows/build-r36s.yml"

permissions:
  contents: read

concurrency:
  group: strikers-r36s-v01
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake python3 pkg-config git curl bzip2 xz-utils zip \
            libegl-dev libgles-dev libglvnd-dev libdrm-dev libgbm-dev libasound2-dev libudev-dev \
            libwayland-bin ccache

      - name: Restore handheld SDK and Dawn
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/melee/build/flip-tools
          key: strikers-r36s-a35-glibc230-dawn-v1

      - name: Prepare handheld toolchain
        run: |
          if [ "${{ steps.toolchain-cache.outputs.cache-hit }}" = "true" ]; then
            SKIP_PREP=1 PREP_ONLY=1 bash scripts/build_v01.sh
          else
            PREP_ONLY=1 bash scripts/build_v01.sh
          fi

      - name: Save handheld SDK and Dawn
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/melee/build/flip-tools
          key: strikers-r36s-a35-glibc230-dawn-v1

      - name: Build PortMaster package
        run: SKIP_PREP=1 bash scripts/build_v01.sh

      - name: Upload V0.1 package
        uses: actions/upload-artifact@v4
        with:
          name: strikers-r36s-v0.1
          path: dist/strikers-r36s-v0.1.zip
          if-no-files-found: error

      - name: Upload configure/build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strikers-r36s-v0.1-build-tree
          path: |
            build/strikers-r36s/CMakeCache.txt
            build/strikers-r36s/CMakeFiles/CMakeConfigureLog.yaml
            build/strikers-r36s/CMakeFiles/CMakeOutput.log
            build/strikers-r36s/CMakeFiles/CMakeError.log
            build/strikers-r36s/strikers-link-failure.log
          if-no-files-found: ignore
