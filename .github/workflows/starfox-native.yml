name: Star Fox Adventures R36S Clean

on:
  push:
    branches:
      - starfox-clean-r36s
      - starfox-performance-recovery
      - starfox-finish
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starfox-r36s-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64:latest

    steps:
      - name: Checkout R36S patch
        uses: actions/checkout@v4

      - name: Prepare glibc 2.28 ARM64 build environment
        shell: bash
        run: |
          set -euxo pipefail
          dnf -y install \
            git curl tar gzip unzip zip patch which file clang lld patchelf ccache \
            pkgconf-pkg-config \
            zlib-devel libjpeg-turbo-devel \
            libX11-devel libXext-devel libXrandr-devel libXcursor-devel \
            libXfixes-devel libXi-devel libXinerama-devel libXScrnSaver-devel libXtst-devel \
            libxkbcommon-devel \
            wayland-devel wayland-protocols-devel \
            alsa-lib-devel pulseaudio-libs-devel \
            systemd-devel dbus-devel \
            libdrm-devel mesa-libgbm-devel mesa-libGL-devel mesa-libEGL-devel \
            vulkan-loader-devel
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          python -m pip install --no-cache-dir "cmake==3.31.6" ninja
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:/opt/python/cp311-cp311/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"
          echo "=== TOOLCHAIN ==="
          uname -a
          ldd --version
          gcc --version
          g++ --version
          clang --version
          clang++ --version
          cmake --version
          ninja --version
          python --version
          rustc --version
          cargo --version

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: starfox-r36s-ccache-v2-${{ github.sha }}
          restore-keys: |
            starfox-r36s-ccache-v2-

      - name: Restore PortMaster SDL3-to-SDL2 shim
        id: sdl3-shim-cache
        uses: actions/cache@v4
        with:
          path: sdl3-shim-install
          key: starfox-r36s-sdl3shim-6057d79b-v2-native-alsa

      - name: Build PortMaster SDL3-to-SDL2 shim
        if: steps.sdl3-shim-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          git clone --branch sdl2-backend https://github.com/bmdhacks/SDL.git sdl3-shim-src
          git -C sdl3-shim-src checkout 6057d79baf8321bf190479a699655f06cc2a962f
          cmake -S sdl3-shim-src -B sdl3-shim-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-shim-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_SDL2_BACKEND=ON -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_OFFSCREEN=OFF -DSDL_DUMMYVIDEO=OFF \
            -DSDL_PIPEWIRE=OFF -DSDL_PULSEAUDIO=OFF \
            -DSDL_ALSA=ON -DSDL_ALSA_SHARED=ON -DSDL_DEPS_SHARED=ON \
            -DSDL_SNDIO=OFF -DSDL_OSS=OFF -DSDL_JACK=OFF \
            -DSDL_DUMMYAUDIO=OFF -DSDL_DISKAUDIO=OFF \
            -DSDL_VULKAN=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON \
            -DSDL_GPU=OFF -DSDL_RENDER_GPU=OFF -DSDL_HIDAPI=OFF \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_DOCS=OFF
          cmake --build sdl3-shim-build --parallel 4
          cmake --install sdl3-shim-build
          test -f sdl3-shim-install/lib64/libSDL3.so.0
          file sdl3-shim-install/lib64/libSDL3.so.0

      - name: Fetch current Foxhollow v1.0.12
        shell: bash
        run: |
          set -euxo pipefail
          retry_clone() {
            local dest="$1"
            shift
            local attempt
            for attempt in 1 2 3 4; do
              rm -rf "$dest"
              if git clone "$@" "$dest"; then
                return 0
              fi
              echo "clone attempt $attempt failed for $dest" >&2
              sleep $((attempt * 2))
            done
            return 1
          }
          retry_clone foxhollow-src https://github.com/JackPriceBurns/foxhollow.git
          cd foxhollow-src
          git checkout 51c0deb7be83e8d5a9961f018dd34c8e0022e062
          rm -rf extern/aurora
          retry_clone extern/aurora --branch gles-direct-submission --single-branch https://github.com/zalo/aurora-arm.git
          git -C extern/aurora checkout 73aa291b0444ab7970e7e77b7faf5ec636c36c65
          echo "Aurora ARM direct-GLES commit: $(git -C extern/aurora rev-parse HEAD)"
          python "$GITHUB_WORKSPACE/r36s/offscreen_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/gbm_adapter_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/direct_gl_present_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/v026_surface_ownership_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/v027_explicit_sdl_gl_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/foxhollow_display_aspect_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/v034_direct_gles_profile_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/v035_zero_vertex_storage_limit_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_clean_visual_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_copytex_correctness_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_efb_alpha_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_uniform_safe_stream_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_shadow_dawn_pass_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_shadow_copy_bounds_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_shadow_copy_diagnostic_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_shadow_source_bounds_fix.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_native_shadow_texture_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_decal_depth_range_fix.py" "$PWD"
          grep -n "r36s-decal-depth" game/src/main/camera.c
          grep -n "r36sNativeShadowMask" extern/aurora/lib/dolphin/gx/GXFrameBuffer.cpp
          python "$GITHUB_WORKSPACE/r36s/starfox_water_effects_lite_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_water_fast_surface_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_lightmap_indirect_budget_patch.py" "$PWD"
          grep -n "r36s-lightmap-indirect" game/src/main/tex_dolphin.c
          grep -n "r36s-water-fast" game/src/main/lightmap_draw.c
          python "$GITHUB_WORKSPACE/tests/test_r36s_shadow_and_water.py" "$PWD"
          grep -n "screenW = w;" game/src/main/newshadows.c
          grep -n "r36sWaterEffectsLite" game/src/main/lightmap_draw.c
          python "$GITHUB_WORKSPACE/tests/test_shadow_copy.py" "$PWD"
          echo "=== Star Fox global uniform-safe + targeted shadow vertex-safe verification ==="
          grep -n 'r36s-uniform-safe' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'directUniformNeeded' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'const GLuint buffer = GetGLInteropBuffer(res.uniformBuffer.Get())' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'r36sShadowDawnPass' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'r36s-shadow-dawn-pass' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'resolveRect.width <= 512' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'GX_CTF_B8.*GX_CTF_R4.*GX_TF_Z8' extern/aurora/lib/gfx/gles_direct.cpp
          grep -n 'drawTexture(texture, 0.0f, 0.0f, 0xff, 0x40)' game/src/main/newshadows.c
          echo "=== EFB-alpha upstream-parity verification ==="
          grep -n 'constexpr bool efb_has_alpha' extern/aurora/lib/gx/gx.hpp
          grep -n 'const bool hasAlpha = efb_has_alpha' extern/aurora/lib/gx/gx.cpp
          grep -n 'regs\[0x43\].*DirtyPipeline' extern/aurora/lib/gx/regs.cpp
          grep -n 'clearAlpha = clear.*efb_has_alpha' extern/aurora/lib/dolphin/gx/GXFrameBuffer.cpp
          echo "=== GXCopyTex upstream-parity verification ==="
          grep -n 'R36S/upstream 9c0bf66' extern/aurora/lib/dolphin/gx/GXFrameBuffer.cpp
          grep -n 'ClipRect rect' extern/aurora/lib/gfx/clear.hpp
          grep -n 'Partial clears must be rendered' extern/aurora/lib/gfx/recording.cpp
          echo "=== V053 visual-safe source verification ==="
          grep -n 'vec4f(1.0, 1.0, 1.0, 1.0)' extern/aurora/lib/gx/shader.cpp
          grep -n 'R36S V048/V053 visual-safe: global doBlurFilter' game/src/main/lightmap.c
          grep -n 'bEnableSpiritVision != 0 && getCurSeqNo() == 0' game/src/main/lightmap.c
          python "$GITHUB_WORKSPACE/r36s/starfox_clean_performance_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_nonblocking_pipeline_preflight_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_gl_error_checks_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_gl_error_checks.py" "$PWD"
          grep -n 'r36s_draw_error_checks_enabled' extern/aurora/lib/gfx/gles_direct.cpp
          python "$GITHUB_WORKSPACE/r36s/starfox_menu_video_cadence_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_menu_video_timing_patch.py" "$PWD"
          grep -n "r36s-menu-jpeg-cost" game/src/main/thp/dll_3e.c
          grep -n "r36sMenuVideoStride" game/src/main/thp/dll_3e.c
          grep -n "audio_kept=1" game/src/main/thp/dll_3e.c
          grep -n "if (!get_pipeline(d.pipeline, p)" extern/aurora/lib/gfx/gles_direct.cpp
          grep -n "if (!wait_pipeline(ref, p.owner, 5000))" extern/aurora/lib/gfx/gles_direct.cpp
          python "$GITHUB_WORKSPACE/r36s/v030_inline_render_worker_patch.py" "$PWD"
          grep -n -A10 'R36S V027 explicit SDL GLES context initialized' extern/aurora/lib/window.cpp || true
          grep -n -A10 'R36S V030 render worker disabled' extern/aurora/lib/gfx/render_worker.cpp || true
          grep -n -A4 'FrameSlotCount' extern/aurora/lib/gfx/frame.hpp
          grep -n -E 'UniformBufferSize|VertexBufferSize|StorageBufferSize|TextureUploadSize' extern/aurora/lib/gfx/resources.hpp
          python "$GITHUB_WORKSPACE/r36s/direct_nod_dvd_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/foxhollow_dvd_callback_pump_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/foxhollow_card_image_path_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/frame_profile_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc4_present_timing_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc4_phase_profile.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc5_gx_stage_profile_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc5_gx_stages.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc6_gx_stats_budget_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc6_gx_stats.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc7_swap_interval_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc7_swap_interval.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc8_sampled_deep_gx_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc8_sampled_deep_gx.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc9_small_index_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc9_small_indices.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc10_bulk_indices_prepared_pipeline_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc10_bulk_indices_pipeline.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_rc11_vertex_loader_reuse_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_rc11_vertex_loader_reuse.py" "$PWD"
          grep -n "r36sPreviousPipeline" extern/aurora/lib/gx/command_processor.cpp
          grep -n "r36sAlreadyPrepared" extern/aurora/lib/gx/command_processor.cpp
          grep -n "r36s_fast_gx_indices_enabled" extern/aurora/lib/gx/command_processor.cpp
          grep -n "r36sRc8" extern/aurora/lib/gx/command_processor.cpp
          grep -n "R36S RC7 SDL GLES swap interval" extern/aurora/lib/window.cpp
          grep -n "r36s_gx_heavy_stats_enabled" extern/aurora/lib/gx/command_processor.cpp
          grep -n "r36s-rc5-gx" extern/aurora/lib/aurora.cpp
          grep -n "r36s-rc4-endframe" extern/aurora/lib/aurora.cpp
          grep -n "r36s-rc4-present" extern/aurora/lib/window.cpp
          # Audio patch requires V025 VI phase instrumentation; apply strictly after it.
          python "$GITHUB_WORKSPACE/r36s/starfox_thp_audio_pump_fix.py" "$PWD"
          python "$GITHUB_WORKSPACE/r36s/starfox_thp_audio_prefetch_patch.py" "$PWD"
          grep -n "r36s-thp-audio-ahead" game/src/main/thp/dll_3e.c
          grep -n "R36S_THP_AUDIO_POOL" game/src/main/thp/dll_3b.c
          grep -n "r36s-thp-audio-starve" game/src/main/thp/n_options.c
          grep -n "r36s-thp-audio-drop" game/src/main/thp/dll_3b.c
          python "$GITHUB_WORKSPACE/tests/test_present_contract.py" "$PWD/extern/aurora/lib/window.cpp"
          # R36S audio: V053 used 200 ms buffering and remained stable through heavy cutscenes.
          # Restore that proven queue together with the native-ALSA SDL3 shim path.
          sed -i 's/#define AI_OUTPUT_QUEUE_MS 40/#define AI_OUTPUT_QUEUE_MS 200/' port/src/ai_shim.c
          grep -n 'AI_OUTPUT_QUEUE_MS' port/src/ai_shim.c
          # RK3326/Mali-G31 r13: force Dawn's OpenGLES backend.
          # The legacy Vulkan ICD crashes inside Dawn PhysicalDevice::InitializeImpl.
          sed -i '/\.appName = "Foxhollow",/a\      .desiredBackend = BACKEND_OPENGLES,\n      .cpuVertexDecode = true,\n      .uniformTable = true,\n      .batchDraws = true,\n      .glesDirectSubmission = 1,\n      .glesMappedStreams = 1,\n      .renderStats = true,\n      .smallCopyPassInterval = 1,' src/main.c
          python "$GITHUB_WORKSPACE/r36s/starfox_opaque_sort_toggle_patch.py" "$PWD"
          python "$GITHUB_WORKSPACE/tests/test_r36s_opaque_sort.py" "$PWD"
          grep -n 'sortOpaqueDraws' src/main.c
          grep -n -A12 'appName = "Foxhollow"' src/main.c
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Configure native AArch64 build
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -M 2G
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe -std=gnu++20 -DAURORA_R36S_OFFSCREEN=1"
          cmake -S foxhollow-src -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdl3-shim-install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=ON \
            -DFOXHOLLOW_DEBUG_SHORTCUTS=OFF \
            -DFOXHOLLOW_STATIC_JPEG=OFF \
            -DAURORA_DAWN_PROVIDER=vendor \
            -DAURORA_DAWN_LINKAGE=static \
            -DDAWN_ENABLE_VULKAN=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF \
            -DDAWN_ENABLE_OPENGLES=ON \
            -DDAWN_USE_WAYLAND=OFF \
            -DAURORA_SDL3_PROVIDER=system \
            -DAURORA_SDL3_LINKAGE=shared \
            -DAURORA_NOD_PROVIDER=vendor \
            -DAURORA_NOD_LINKAGE=static \
            -DAURORA_VERTEX_BUFFER_MIB=8 \
            -DAURORA_GLES_DIRECT=ON \
            -DAURORA_GLES_DIRECT_DAWN_INCLUDE_DIR="$GITHUB_WORKSPACE/build/_deps/dawn-src/include" \
            -DAURORA_UNIFORM_WINDOW_KIB=16 \
            -DAURORA_DEEP_TIMERS=OFF

      - name: Patch Dawn for RK3326 legacy Mali EGL
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail -o /tmp/dawn-gl-interop.patch https://raw.githubusercontent.com/zalo/melee/portmaster/native/platform/flip/dawn-gl-interop.patch
          patch --batch --forward -p1 -d "$GITHUB_WORKSPACE/build/_deps/dawn-src" < /tmp/dawn-gl-interop.patch
          python "$GITHUB_WORKSPACE/r36s/dawn_legacy_mali_patch.py" "$GITHUB_WORKSPACE/build/_deps/dawn-src"
          python "$GITHUB_WORKSPACE/r36s/v034_dawn_present_compat_patch.py" "$GITHUB_WORKSPACE/build/_deps/dawn-src"
          grep -n 'GLInteropRenderPassCallback' "$GITHUB_WORKSPACE/build/_deps/dawn-src/include/dawn/native/OpenGLBackend.h"
          # Re-run configure after patching Dawn so Aurora detects the native GL interop extension.
          cmake -S "$GITHUB_WORKSPACE/foxhollow-src" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdl3-shim-install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DAURORA_SDL3_PROVIDER=system \
            -DAURORA_SDL3_LINKAGE=shared \
            -DAURORA_NOD_PROVIDER=vendor \
            -DAURORA_NOD_LINKAGE=static \
            -DAURORA_VERTEX_BUFFER_MIB=8 \
            -DAURORA_GLES_DIRECT=ON \
            -DAURORA_GLES_DIRECT_DAWN_INCLUDE_DIR="$GITHUB_WORKSPACE/build/_deps/dawn-src/include" \
            -DAURORA_UNIFORM_WINDOW_KIB=16 \
            -DAURORA_DEEP_TIMERS=OFF
          grep -R "OpenGL ES direct submission enabled" "$GITHUB_WORKSPACE/build/CMakeFiles" "$GITHUB_WORKSPACE/build" 2>/dev/null | head -5 || true
          grep -n -A18 'AppendNewDeviceFrom' "$GITHUB_WORKSPACE/build/_deps/dawn-src/src/dawn/native/opengl/BackendGL.cpp" | head -30

      - name: Build Foxhollow
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          cmake --build build --target foxhollow --parallel 4
          ccache -s

      - name: Verify ArkOS compatibility and package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact/lib
          cp build/foxhollow artifact/foxhollow.aarch64
          chmod +x artifact/foxhollow.aarch64

          # Bundle non-glibc runtime libraries so ArkOS only needs its own glibc/loader.
          cp -L /usr/lib64/libjpeg.so.62 artifact/lib/libjpeg.so.62
          cp -L /lib64/libz.so.1 artifact/lib/libz.so.1
          cp -L /lib64/libstdc++.so.6 artifact/lib/libstdc++.so.6
          cp -L /lib64/libgcc_s.so.1 artifact/lib/libgcc_s.so.1
          PNG_LIB="$(find build /usr/lib64 /lib64 -type f -name 'libpng16.so.16*' -o -type l -name 'libpng16.so.16*' 2>/dev/null | head -1)"
          if [ -z "$PNG_LIB" ]; then
            echo "ERROR: libpng16.so.16 not found"
            find build/_deps -maxdepth 4 -iname '*png*' -o -iname 'libpng*' | head -100 || true
            exit 1
          fi
          echo "Bundling libpng from: $PNG_LIB"
          cp -L "$PNG_LIB" artifact/lib/libpng16.so.16
          cp -L /opt/_internal/sqlite3/lib/libsqlite3.so artifact/lib/libsqlite3.so
          cp -L sdl3-shim-install/lib64/libSDL3.so.0 artifact/lib/libSDL3.so.0

          # Remove build-machine absolute paths and use libraries next to the port binary.
          patchelf --replace-needed /opt/_internal/sqlite3/lib/libsqlite3.so libsqlite3.so artifact/foxhollow.aarch64
          patchelf --set-rpath '$ORIGIN/../lib' artifact/foxhollow.aarch64

          # Strip debug data; keep executable symbols needed at runtime.
          strip --strip-unneeded artifact/foxhollow.aarch64 || true
          for lib in artifact/lib/*.so*; do
            strip --strip-unneeded "$lib" 2>/dev/null || true
          done

          file artifact/foxhollow.aarch64 | tee artifact/file.txt
          readelf -d artifact/foxhollow.aarch64 | tee artifact/dynamic.txt
          readelf --version-info artifact/foxhollow.aarch64 | tee artifact/version-info.txt
          strings artifact/foxhollow.aarch64 | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tee artifact/glibc-symbols.txt || true
          HIGHEST="$(strings artifact/foxhollow.aarch64 | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1 || true)"
          echo "Highest GLIBC symbol: ${HIGHEST:-none}" | tee artifact/compatibility.txt

          echo "=== Patched NEEDED/RUNPATH ===" | tee artifact/runtime-check.txt
          readelf -d artifact/foxhollow.aarch64 | grep -E 'NEEDED|RPATH|RUNPATH' | tee -a artifact/runtime-check.txt

          echo "=== Bundled runtime GLIBC requirements ===" | tee artifact/lib-glibc.txt
          for lib in artifact/lib/*.so*; do
            req="$(strings "$lib" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1 || true)"
            echo "$(basename "$lib"): ${req:-none}" | tee -a artifact/lib-glibc.txt
          done

          {
            echo "R36S patch commit: $GITHUB_SHA"
            echo "Port version: R36S-RC11 GX VERTEX LOADER CACHE (hardware validation pending)"
            echo "RC11 caches vertex loader for unchanged GX pipeline, avoiding many per-draw config hashes; RC10 bulk indices and previous visual safety preserved"
            echo "Foxhollow commit: 51c0deb7be83e8d5a9961f018dd34c8e0022e062 (v1.0.12)"
            echo "Build container: quay.io/pypa/manylinux_2_28_aarch64"
            echo "Target: R36S ArkOS AeUX / aarch64 / glibc 2.30"
            echo "Default GameCube language: German (1)"
            echo "Graphics backend: Aurora ARM direct GLES submission + CPU vertex decode + V027 direct present + inline renderer + current Foxhollow EFB/reflection compatibility"
            echo "Reflection path: 8 MiB planar-reflection index stream; RGB565/Z8 copies update every frame; optional lite waterFX overlays"
            echo "GXCopyTex correctness: upstream 9c0bf66 copy parity; no pre-copy dst-alpha overwrite; partial clears scoped to copy rectangle"
            echo "EFB alpha semantics: upstream 3840bf9 subset; no alpha updates on RGB EFB; DSTALPHA=1 / INVDSTALPHA=0; pixel-format changes rebuild pipeline"
            echo "Uniform compatibility: Direct-GLES uses Dawn uniforms; R36S model shadow source 256px clipped-EFB fix; optional Dawn shadow fallback"
            echo "Stream uploads: mapped GL streams enabled (restored V053 setting)"
            echo "V053 visual safety: white missing-vertex-color fallback; global blur EFB-feedback bypass; Spirit Vision postprocess only outside scripted sequences"
            echo "Timing/performance: MENU VIDEO EVERY THP FRAME (stride 1) + 16-buffer THP audio sidecar + 10-frame independent audio prefetch + starvation counters"
            echo "SDL: shared SDL3-to-system-SDL2 PortMaster shim 6057d79b (ArkOS KMSDRM + native ALSA)"
            echo "Audio queue: 200 ms (restored V053 underrun guard)"
            echo "DVD loader: direct nod path open (RVZ diagnostics enabled)"
            echo "Highest executable GLIBC symbol: ${HIGHEST:-none}"
            echo "Runtime path: \$ORIGIN/../lib"
          } > artifact/BUILD_INFO.txt

          sha256sum artifact/foxhollow.aarch64 artifact/lib/* > artifact/SHA256SUMS.txt

      - name: Assemble clean PortMaster package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf package
          mkdir -p \
            package/starfoxadventures/bin \
            package/starfoxadventures/lib \
            package/starfoxadventures/conf \
            package/starfoxadventures/gamedata \
            package/starfoxadventures/logs

          cp artifact/foxhollow.aarch64 package/starfoxadventures/bin/foxhollow.aarch64
          cp -a artifact/lib/. package/starfoxadventures/lib/
          cp artifact/BUILD_INFO.txt package/starfoxadventures/BUILD_INFO.txt
          sed -e 's#artifact/foxhollow.aarch64#bin/foxhollow.aarch64#' -e 's#artifact/lib/#lib/#' artifact/SHA256SUMS.txt > package/starfoxadventures/SHA256SUMS-runtime.txt

          cp "$GITHUB_WORKSPACE/r36s/starfox_clean_launcher.sh" "package/Star Fox Adventures.sh"
          chmod +x "package/Star Fox Adventures.sh" package/starfoxadventures/bin/foxhollow.aarch64
          cp "$GITHUB_WORKSPACE/r36s/starfox_clean_port.json" package/port.json
          cp "$GITHUB_WORKSPACE/r36s/starfox_clean_gameinfo.xml" package/gameinfo.xml
          cp "$GITHUB_WORKSPACE/r36s/starfox_clean_README.txt" package/README.txt

          cat > package/starfoxadventures/gamedata/PUT_GAME_HERE.txt <<'EOF'
          Put your supported Star Fox Adventures Europe Rev 1 .rvz/.iso/.gcm here.
          The clean package intentionally contains no copyrighted game data.
          EOF

          cat > package/starfoxadventures/conf/COPY_OLD_CONF_CONTENTS_HERE.txt <<'EOF'
          Copy the CONTENTS of your existing working starfoxadventures/conf folder here.
          You do not need to copy any old launcher, libsf*.so test helper, or old versioned files.
          EOF

          find package -maxdepth 3 -type f -print | sort | tee package/PACKAGE_CONTENTS.txt
          (cd package && sha256sum "Star Fox Adventures.sh" starfoxadventures/bin/foxhollow.aarch64 starfoxadventures/lib/* > CLEAN_SHA256SUMS.txt)
          (cd package && zip -9 -r "$GITHUB_WORKSPACE/starfoxadventures-r36s-clean.zip" .)

      - name: Upload clean full port
        uses: actions/upload-artifact@v4
        with:
          name: starfoxadventures-r36s-clean
          path: starfoxadventures-r36s-clean.zip
          if-no-files-found: error
